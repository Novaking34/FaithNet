# @date          2026-11-18
# @author        CreativeWorkzStudio LLC / ProfessorSeanEX
# @repository    https://github.com/Novaking34/FaithNet
# @role          Disable Aggressive PCIe ASPM & Firmware Sleep on Realtek rtw89_8852ce
# @invariants    1. Strictly additive modprobe.d drop-in; zero mutation of vendor files.
#                2. 100% reversible: `sudo rm /etc/modprobe.d/99-faithnet-rtw89-stability.conf`.
#                3. Takes effect cleanly on next reboot without interrupting active Wi-Fi.
# ==============================================================================

# ==============================================================================
# BLOCK 2: OPENING BLOCK
# ( Hardware Rationale & Scope )
# ==============================================================================
# On Dell Inspiron 16 5640 (Realtek RTL8852CE / rtw89_8852ce), aggressive PCIe
# L1/L1SS sleep and firmware low-power mode cause `timed out to flush queues`,
# sluggish band scans, and dropped 802.11 auth/DHCP frames during channel switches
# and shared STA+AP operation.

# ==============================================================================
# BLOCK 3: BODY BLOCK
# ( Kernel Module Options )
# ==============================================================================
options rtw89_pci disable_aspm_l1=y disable_aspm_l1ss=y
options rtw89_core disable_ps_mode=y

# ==============================================================================
# BLOCK 4: AUDIT PROCEDURES BLOCK
# ( Verification After Reboot )
# ==============================================================================
# Verify live state with:
#   cat /sys/module/rtw89_pci/parameters/disable_aspm_l1
#   cat /sys/module/rtw89_pci/parameters/disable_aspm_l1ss
#   cat /sys/module/rtw89_core/parameters/disable_ps_mode
# Or run: `faithnet-netctl health`

# ==============================================================================
# BLOCK 5: CLOSING BLOCK
# ( Reversible Teardown )
# ==============================================================================
# Rollback: sudo rm -f /etc/modprobe.d/99-faithnet-rtw89-stability.conf
